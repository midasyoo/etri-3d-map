<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETRI 본원 3D 조감도</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #ffffff;
    --panel2: #f1f5f9;
    --ink: #0f172a;
    --sub: #64748b;
    --brand: #1a237e;
    --brand2: #3949ab;
    --accent: #f59e0b;
    --ok: #059669;
    --line: #e2e8f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
  }
  #app { display: flex; height: 100vh; }

  /* ---------- sidebar ---------- */
  #sidebar {
    width: 320px; min-width: 320px;
    background: var(--panel);
    display: flex; flex-direction: column;
    box-shadow: 2px 0 12px rgba(0,0,0,.25);
    z-index: 20;
    transition: margin-left .25s ease;
  }
  #sidebar.hidden { margin-left: -320px; }
  .side-head {
    background: linear-gradient(135deg, #1a237e, #283593);
    color: #fff; padding: 16px 16px 14px;
  }
  .side-head h1 { font-size: 1.12em; letter-spacing: -.2px; }
  .side-head .sub { font-size: .76em; opacity: .78; margin-top: 3px; }
  .searchbox { position: relative; margin-top: 12px; }
  .searchbox input {
    width: 100%; padding: 9px 14px 9px 36px;
    border: none; border-radius: 20px; outline: none;
    font-size: 14px; font-family: inherit;
    background: rgba(255,255,255,.95); color: #222;
  }
  .searchbox .icon {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    color: #888; font-size: 14px;
  }
  #search-results {
    display: none;
    position: absolute; top: 42px; left: 0; right: 0;
    background: #fff; border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.28);
    max-height: 320px; overflow-y: auto; z-index: 50;
  }
  #search-results.open { display: block; }
  .sr-item {
    padding: 8px 12px; cursor: pointer; font-size: .84em;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px;
  }
  .sr-item:last-child { border-bottom: none; }
  .sr-item:hover { background: var(--panel2); }
  .sr-main { flex: 1; min-width: 0; }
  .sr-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .sr-go {
    border: 1px solid #d97706; color: #b45309; background: #fffbeb;
    border-radius: 6px; padding: 3px 8px; font-size: .76em;
    cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .sr-go:hover { background: #f59e0b; color: #fff; }
  .sr-item .t { font-weight: 600; color: var(--ink); }
  .sr-item .d { color: var(--sub); font-size: .92em; margin-top: 1px; }
  .sr-item .tag {
    display: inline-block; font-size: .74em; padding: 1px 7px; border-radius: 9px;
    background: #e8eaf6; color: #283593; margin-right: 5px; vertical-align: 1px;
  }
  .sr-none { padding: 12px; color: var(--sub); font-size: .84em; }

  #blist { flex: 1; overflow-y: auto; padding: 10px; background: var(--panel2); }
  .group-title {
    font-size: .74em; font-weight: 700; color: var(--sub);
    margin: 10px 6px 6px; letter-spacing: .06em;
  }
  .bcard {
    background: #fff; border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 7px; cursor: pointer;
    transition: box-shadow .15s, transform .15s, border-color .15s;
  }
  .bcard:hover { box-shadow: 0 3px 10px rgba(0,0,0,.10); transform: translateY(-1px); }
  .bcard.active { border-color: var(--brand2); box-shadow: 0 0 0 2px rgba(57,73,171,.25); }
  .bcard .row1 { display: flex; justify-content: space-between; align-items: center; }
  .bcard .bname { font-weight: 700; font-size: .92em; }
  .bcard .bnum {
    font-size: .72em; background: var(--brand); color: #fff;
    border-radius: 8px; padding: 1px 8px; flex-shrink: 0;
  }
  .bcard .bnum.remote { background: #6d4c41; }
  .bcard .bfac { font-size: .76em; color: var(--sub); margin-top: 3px; line-height: 1.45; }
  .bcard .bmeta { font-size: .72em; color: #94a3b8; margin-top: 4px; }
  .side-foot {
    padding: 8px 14px; font-size: .7em; color: var(--sub);
    border-top: 1px solid var(--line); background: #fff; line-height: 1.5;
  }
  .side-foot a { color: var(--brand2); text-decoration: none; }

  /* ---------- viewport ---------- */
  #viewport { flex: 1; position: relative; min-width: 0; }
  #canvas3d { position: absolute; inset: 0; }
  #canvas3d canvas { display: block; }

  #topbar {
    position: absolute; top: 12px; left: 12px; z-index: 10;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  .tbtn {
    background: rgba(15,23,42,.78); color: #e2e8f0;
    border: 1px solid rgba(255,255,255,.14); border-radius: 8px;
    padding: 7px 12px; font-size: .8em; cursor: pointer; font-family: inherit;
    backdrop-filter: blur(6px);
  }
  .tbtn:hover { background: rgba(30,41,59,.9); }
  .tbtn.on { background: var(--brand2); border-color: var(--brand2); color: #fff; }

  #hint {
    position: absolute; bottom: 12px; left: 12px; z-index: 10;
    background: rgba(15,23,42,.65); color: #cbd5e1;
    font-size: .72em; padding: 6px 11px; border-radius: 8px;
    backdrop-filter: blur(6px);
  }

  /* ---------- route bar ---------- */
  #routebar {
    display: none;
    position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
    z-index: 11; background: rgba(15,23,42,.85); color: #fff;
    border: 1px solid rgba(255,255,255,.16); border-radius: 12px;
    padding: 9px 16px; font-size: .84em; backdrop-filter: blur(8px);
    display: none; align-items: center; gap: 14px; white-space: nowrap;
  }
  #routebar.show { display: flex; }
  #routebar .rt { font-weight: 700; color: #fbbf24; }
  #routebar .rd { color: #cbd5e1; }
  #routebar button {
    background: none; border: 1px solid rgba(255,255,255,.3); color: #e2e8f0;
    border-radius: 6px; padding: 3px 9px; cursor: pointer; font-size: .9em; font-family: inherit;
  }
  #routebar button:hover { background: rgba(255,255,255,.12); }

  /* ---------- detail panel ---------- */
  #detail {
    position: absolute; top: 0; right: 0; bottom: 0; width: 340px;
    background: var(--panel); z-index: 15;
    box-shadow: -4px 0 16px rgba(0,0,0,.3);
    transform: translateX(105%); transition: transform .25s ease;
    display: flex; flex-direction: column;
  }
  #detail.open { transform: translateX(0); }
  .d-head { background: linear-gradient(135deg, #283593, #3949ab); color: #fff; padding: 16px; position: relative; }
  .d-head h2 { font-size: 1.08em; padding-right: 30px; }
  .d-head .dnum { font-size: .74em; opacity: .85; margin-top: 3px; }
  .d-close {
    position: absolute; top: 12px; right: 12px; width: 26px; height: 26px;
    border: none; border-radius: 50%; background: rgba(255,255,255,.18);
    color: #fff; font-size: 15px; cursor: pointer; line-height: 1;
  }
  .d-close:hover { background: rgba(255,255,255,.32); }
  .d-body { flex: 1; overflow-y: auto; padding: 14px; }
  .d-sec { margin-bottom: 16px; }
  .d-sec h3 {
    font-size: .78em; color: var(--sub); font-weight: 700;
    letter-spacing: .05em; margin-bottom: 7px;
  }
  .d-fac { font-size: .85em; line-height: 1.6; color: #334155; }
  .d-actions { display: flex; gap: 7px; flex-wrap: wrap; }
  .abtn {
    flex: 1; min-width: 130px;
    border: none; border-radius: 9px; padding: 10px 8px;
    font-size: .82em; font-weight: 700; cursor: pointer; font-family: inherit;
    text-align: center; text-decoration: none; display: inline-block;
  }
  .abtn.route { background: var(--accent); color: #fff; }
  .abtn.route:hover { background: #d97706; }
  .abtn.route.alt { background: #78716c; }
  .abtn.route.alt:hover { background: #57534e; }
  .abtn.mm { background: var(--brand2); color: #fff; }
  .abtn.mm:hover { background: var(--brand); }
  .floor-row {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--panel2); border-radius: 8px; padding: 8px 11px; margin-bottom: 5px;
  }
  .floor-row .fn { font-weight: 700; font-size: .85em; }
  .floor-row .fc { font-size: .74em; color: var(--sub); margin-left: 8px; }
  .floor-row .fbtns { display: flex; gap: 5px; }
  .fbtn {
    border: 1px solid var(--brand2); color: var(--brand2); background: #fff;
    border-radius: 6px; padding: 3px 9px; font-size: .74em; cursor: pointer; font-family: inherit;
  }
  .fbtn:hover { background: var(--brand2); color: #fff; }
  .conf-note {
    font-size: .72em; color: #92400e; background: #fef3c7;
    border-radius: 7px; padding: 7px 10px; line-height: 1.5;
  }
  .conf-note.ok { color: #065f46; background: #d1fae5; }

  /* ---------- modal (MeetMap iframe) ---------- */
  #modal {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(2,6,23,.72); backdrop-filter: blur(3px);
    align-items: center; justify-content: center;
  }
  #modal.open { display: flex; }
  .m-box {
    width: min(1060px, 94vw); height: min(760px, 92vh);
    background: #fff; border-radius: 14px; overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 24px 64px rgba(0,0,0,.5);
  }
  .m-head {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; background: var(--brand); color: #fff;
  }
  .m-head .mt { font-weight: 700; font-size: .92em; flex: 1; }
  .m-head a, .m-head button {
    background: rgba(255,255,255,.16); color: #fff; border: none;
    border-radius: 7px; padding: 5px 11px; font-size: .78em;
    cursor: pointer; text-decoration: none; font-family: inherit;
  }
  .m-head a:hover, .m-head button:hover { background: rgba(255,255,255,.3); }
  .m-box iframe { flex: 1; border: none; width: 100%; background: #f0f0f0; }

  /* ---------- 3D labels ---------- */
  .lbl3d {
    position: absolute; transform: translate(-50%, -100%);
    background: rgba(15,23,42,.82); color: #f1f5f9;
    font-size: 11px; padding: 3px 9px; border-radius: 10px;
    pointer-events: none; white-space: nowrap;
    border: 1px solid rgba(255,255,255,.16);
  }
  .lbl3d.gate { background: rgba(180,83,9,.92); font-weight: 700; }
  .lbl3d.sel { background: var(--brand2); font-weight: 700; border-color: #fff; }
  .lbl3d.score {
    background: rgba(120,53,15,.92); font-weight: 700; border-color: #fbbf24;
    font-size: 11.5px;
  }
  .lbl3d.entry {
    background: rgba(5,150,105,.92); font-weight: 700; border-color: #fff;
    transform: translate(-50%, 0);
  }

  /* ---------- 길찾기 퀵 박스 ---------- */
  .routebox {
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    padding: 9px 10px; background: #fff; border-bottom: 1px solid var(--line);
  }
  #rb-person { width: 90px; flex-shrink: 0; }
  .routebox .rb-lbl { font-size: .74em; font-weight: 700; color: var(--sub); flex-shrink: 0; }
  .routebox select {
    font-family: inherit; font-size: .8em; padding: 6px 6px;
    border: 1px solid var(--line); border-radius: 7px; background: #fff; color: var(--ink);
    outline: none; min-width: 0;
  }
  .routebox select:focus { border-color: var(--brand2); }
  #rb-from { width: 74px; flex-shrink: 0; }
  #rb-dest { flex: 1; }
  #rb-go {
    border: none; border-radius: 7px; background: var(--accent); color: #fff;
    font-weight: 700; font-size: .8em; padding: 7px 12px; cursor: pointer;
    font-family: inherit; flex-shrink: 0;
  }
  #rb-go:hover { background: #d97706; }

  /* ---------- 데모(홍보 영상) 오버레이 ---------- */
  .demo-scrim {
    position: absolute; left: 0; right: 0; top: 0; bottom: 0; z-index: 28;
    pointer-events: none; opacity: 0; transition: opacity .7s ease;
    background: radial-gradient(ellipse at 50% 42%, rgba(4,10,24,.72) 0%,
                rgba(4,10,24,.55) 38%, rgba(4,10,24,0) 72%);
  }
  .demo-scrim.show { opacity: 1; }
  .demo-title, .demo-end {
    position: absolute; left: 0; right: 0; top: 30%;
    text-align: center; z-index: 30; pointer-events: none;
    opacity: 0; transition: opacity .7s ease, transform .7s ease;
    transform: translateY(18px);
    text-shadow: 0 4px 22px rgba(0,0,0,.65);
  }
  .demo-title.show, .demo-end.show { opacity: 1; transform: translateY(0); }
  .dt-logo { font: 900 76px Arial, sans-serif; letter-spacing: 2px; margin-bottom: 6px; }
  .dt-logo .e, .dt-logo .t, .dt-logo .i { color: #2f7fe0; }
  .dt-logo .r { color: #ff4d45; }
  .dt-main { font-size: 40px; font-weight: 800; color: #fff; letter-spacing: -.5px; }
  .dt-sub { font-size: 19px; color: #ffe08a; margin-top: 10px; font-weight: 700; }
  .de-main { font-size: 50px; font-weight: 900; color: #fff; }
  .de-sub { font-size: 18px; color: #dbe7f5; margin-top: 12px; }
  .de-url {
    display: inline-block; margin-top: 16px; font-size: 22px; font-weight: 800;
    color: #0f172a; background: #ffd24a; padding: 8px 20px; border-radius: 22px;
  }
  .demo-lower {
    position: absolute; left: 44px; bottom: 58px; z-index: 30; pointer-events: none;
    opacity: 0; transform: translateX(-24px); transition: opacity .45s ease, transform .45s ease;
    text-shadow: 0 3px 16px rgba(0,0,0,.7);
  }
  .demo-lower.show { opacity: 1; transform: translateX(0); }
  .dl-chip {
    display: inline-block; background: linear-gradient(135deg,#ff8a2b,#ff5a3c); color: #fff;
    font-size: 15px; font-weight: 800; padding: 4px 14px; border-radius: 14px; margin-bottom: 8px;
  }
  .dl-name { font-size: 40px; font-weight: 900; color: #fff; line-height: 1.1; }
  .dl-fac { font-size: 16px; color: #d7e6f7; margin-top: 7px; max-width: 620px; font-weight: 600; }
  .demo-route {
    position: absolute; left: 44px; top: 34px; z-index: 30; pointer-events: none;
    background: rgba(15,23,42,.72); color: #ffe08a; font-size: 17px; font-weight: 800;
    padding: 9px 18px; border-radius: 22px; backdrop-filter: blur(6px);
    opacity: 0; transition: opacity .4s ease; border: 1px solid rgba(255,255,255,.18);
  }
  .demo-route.show { opacity: 1; }
  .demo-tip {
    position: absolute; right: 44px; bottom: 62px; z-index: 30; pointer-events: none;
    font-size: 21px; font-weight: 800; color: #fff; opacity: 0;
    transition: opacity .6s ease; text-shadow: 0 3px 16px rgba(0,0,0,.7);
    border-right: 4px solid #ffd24a; padding-right: 14px;
  }
  .demo-tip.show { opacity: 1; }
  .demo-bar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 5px;
    background: rgba(255,255,255,.14); z-index: 31;
  }
  .demo-bar i { display: block; height: 100%; width: 0;
    background: linear-gradient(90deg,#2f7fe0,#ffd24a); }
  .demo-flash {
    position: absolute; inset: 0; z-index: 29; pointer-events: none;
    background: #fff; opacity: 0;
  }
  .demo-flash.go { animation: dflash .45s ease-out; }
  @keyframes dflash { 0% { opacity: .5; } 100% { opacity: 0; } }

  /* ---------- 외부 공개판 고지 ---------- */
  #public-notice {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 96px;
    z-index: 12; background: rgba(120,53,15,.88); color: #ffe9b8;
    border: 1px solid rgba(255,210,74,.45); border-radius: 20px;
    padding: 7px 18px; font-size: .74em; backdrop-filter: blur(6px);
    white-space: nowrap; pointer-events: none;
  }
  #public-notice b { color: #ffd24a; }

  /* ---------- 캐릭터 말풍선 ---------- */
  .bubble3d {
    position: absolute; transform: translate(-50%, -100%);
    background: rgba(255,255,255,.96); color: #1e293b;
    font-size: 13px; font-weight: 700; padding: 7px 13px;
    border-radius: 14px; pointer-events: none; white-space: nowrap;
    box-shadow: 0 3px 12px rgba(0,0,0,.35); z-index: 9;
    border: 2px solid var(--brand2);
  }
  .bubble3d::after {
    content: ''; position: absolute; left: 50%; bottom: -9px;
    transform: translateX(-50%);
    border-left: 8px solid transparent; border-right: 8px solid transparent;
    border-top: 9px solid var(--brand2);
  }

  /* ---------- 방문 시각 · 날씨 ---------- */
  #envbar {
    position: absolute; bottom: 44px; left: 12px; right: 12px; z-index: 11;
    display: flex; align-items: center; gap: 6px; flex-wrap: nowrap;
    overflow-x: auto; max-width: calc(100% - 24px);
    background: rgba(15,23,42,.8); border: 1px solid rgba(255,255,255,.16);
    border-radius: 10px; padding: 7px 10px; backdrop-filter: blur(8px);
  }
  #envbar .e-lbl { font-size: .72em; font-weight: 700; color: #cbd5e1; }
  #envbar input, #envbar select {
    font-family: inherit; font-size: .75em; padding: 4px 6px;
    border: 1px solid rgba(255,255,255,.22); border-radius: 6px;
    background: rgba(255,255,255,.95); color: #1e293b; outline: none;
  }
  #envbar button {
    font-family: inherit; font-size: .74em; padding: 5px 9px; cursor: pointer;
    border: none; border-radius: 6px; background: var(--brand2); color: #fff; font-weight: 700;
  }
  #envbar button:hover { background: #2c3a9e; }
  #env-info {
    font-size: .74em; color: #fde68a; font-weight: 700;
    padding-left: 4px; white-space: nowrap;
  }

  /* ---------- 제작자 크레딧 ---------- */
  #credit {
    position: absolute; top: 12px; right: 16px; z-index: 12;
    text-align: right; line-height: 1.45; pointer-events: none;
    color: #eef4fb; font-size: .72em;
    text-shadow: 0 1px 3px rgba(0,0,0,.65), 0 0 10px rgba(0,0,0,.4);
    transition: right .25s ease;
  }
  #credit .c-name { font-weight: 700; font-size: 1.08em; letter-spacing: .01em; }
  #credit .c-mail { opacity: .9; }
  #credit .c-date { opacity: .78; }
  #detail.open ~ #credit { right: 356px; }

  /* ---------- 나침반 ---------- */
  #compass {
    position: absolute; top: 106px; right: 16px; width: 76px; height: 76px;
    z-index: 10; cursor: pointer; transition: right .25s ease;
  }
  #detail.open ~ #compass { right: 356px; }
  #compass svg { width: 100%; height: 100%; filter: drop-shadow(0 2px 6px rgba(0,0,0,.45)); }
  #compass:hover circle.bg { fill: rgba(30,41,59,.9); }

  #toast {
    position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: rgba(15,23,42,.92); color: #fff; font-size: .8em;
    padding: 9px 18px; border-radius: 10px; z-index: 60;
    opacity: 0; transition: opacity .3s; pointer-events: none;
  }
  #toast.show { opacity: 1; }

  @media (max-width: 900px) {
    #sidebar { position: absolute; height: 100%; }
    #detail { width: 300px; }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="side-head">
      <h1>🛰️ ETRI 본원 3D 조감도</h1>
      <div class="sub">대전본원 · 건물 조회 / 호실 검색 / 정문 경로 안내</div>
      <div class="searchbox">
        <span class="icon">🔍</span>
        <input id="search" type="text" autocomplete="off"
               placeholder="건물·별칭·호실 검색 (예: 7동, 도서관, 7-136)">
        <div id="search-results"></div>
      </div>
    </div>
    <div class="routebox">
      <span class="rb-lbl">🚶 길찾기</span>
      <select id="rb-from">
        <option value="main">정문</option>
        <option value="back">후문</option>
      </select>
      <select id="rb-dest">
        <option value="">도착 건물 선택…</option>
      </select>
      <select id="rb-person" title="안내 캐릭터 선택">
        <option value="m">👨 남성</option>
        <option value="f">👩 여성</option>
        <option value="penguin">🐧 펭귄</option>
        <option value="dolphin">🐬 돌고래</option>
        <option value="eagle">🦅 독수리</option>
        <option value="croc">🐊 악어</option>
        <option value="cat">🐱 고양이</option>
        <option value="squirrel">🐿️ 청설모</option>
        <option value="chipmunk">🐹 다람쥐</option>
        <option value="deer">🦌 고라니</option>
        <option value="rat">🐭 쥐</option>
        <option value="ox">🐮 소</option>
        <option value="tiger">🐯 호랑이</option>
        <option value="rabbit">🐰 토끼</option>
        <option value="dragon">🐲 용</option>
        <option value="snake">🐍 뱀</option>
        <option value="horse">🐴 말</option>
        <option value="sheep">🐑 양</option>
        <option value="monkey">🐵 원숭이</option>
        <option value="rooster">🐔 닭</option>
        <option value="dog">🐶 개</option>
        <option value="pig">🐷 돼지</option>
      </select>
      <button id="rb-go">안내</button>
    </div>
    <div id="blist"></div>
    <div class="side-foot">
      데이터: OpenStreetMap · ETRI 공개 배치도<br>
      건물 위치·형상은 근사치이며 실제와 다를 수 있습니다.
    </div>
  </aside>

  <main id="viewport">
    <div id="canvas3d"></div>
    <div id="topbar">
      <button class="tbtn" id="btn-side">☰ 목록</button>
      <button class="tbtn" id="btn-reset">⟲ 처음 뷰</button>
      <button class="tbtn" id="btn-top">🗺️ 탑뷰</button>
      <button class="tbtn on" id="btn-labels">🏷️ 라벨</button>
      <button class="tbtn" id="btn-spin">🔄 자동회전</button>
      <button class="tbtn" id="btn-voice">🔈 음성</button>
      <button class="tbtn" id="btn-api">📡 API</button>
    </div>
    <div id="routebar">
      <span class="rt" id="route-title"></span>
      <span class="rd" id="route-desc"></span>
      <button id="route-clear">경로 지우기</button>
    </div>
    <div id="hint">드래그: 회전 · 휠: 확대/축소 · 우클릭 드래그: 이동 · 건물 클릭: 상세정보</div>

    <div id="envbar">
      <span class="e-lbl">📅 방문</span>
      <input id="env-date" type="date">
      <input id="env-time" type="time" step="600">
      <select id="env-weather" title="날씨">
        <option value="auto">자동(날짜기반)</option>
        <option value="sunny">☀️ 맑음</option>
        <option value="cloudy">☁️ 흐림</option>
        <option value="rain">🌧️ 비</option>
        <option value="snow">❄️ 눈</option>
        <option value="fog">🌫️ 안개</option>
      </select>
      <button id="env-now">현재</button>
      <span class="e-lbl">🏟️ 경기</span>
      <select id="sport-mode" title="경기 진행/성능 모드">
        <option value="auto">자동(시간대)</option>
        <option value="play">경기 진행</option>
        <option value="bench">대기석(경기 종료)</option>
        <option value="off">중지(성능 우선)</option>
      </select>
      <select id="sport-pick" title="진행할 종목">
        <option value="all">전 종목</option>
        <option value="baseball">⚾ 야구만</option>
        <option value="tennis">🎾 테니스만</option>
        <option value="jokgu">🏐 족구만</option>
        <option value="soccer">⚽ 축구만</option>
      </select>
      <span id="env-info"></span>
    </div>

    <div id="detail">
      <div class="d-head">
        <h2 id="d-name"></h2>
        <div class="dnum" id="d-num"></div>
        <button class="d-close" id="d-close">✕</button>
      </div>
      <div class="d-body" id="d-body"></div>
    </div>
    <div id="credit">
      <div class="c-name">created by Yoon-Sik Yoo, Ph.D.</div>
      <div class="c-mail">midasyoo@etri.re.kr</div>
      <div class="c-date">2026.09.17</div>
    </div>
    <div id="compass" title="클릭: 북쪽으로 정렬">
      <svg viewBox="0 0 80 80">
        <circle class="bg" cx="40" cy="40" r="38" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.28)" stroke-width="1.5"/>
        <g id="compass-rose">
          <polygon points="40,16 34,40 46,40" fill="#ef4444"/>
          <polygon points="34,40 46,40 40,64" fill="#cbd5e1"/>
          <text x="40" y="13" text-anchor="middle" dominant-baseline="central"
                font-size="11" font-weight="700" fill="#f87171" font-family="Arial">N</text>
          <text x="40" y="72" text-anchor="middle" dominant-baseline="central"
                font-size="9" fill="#cbd5e1" font-family="Arial">S</text>
          <text x="70" y="41" text-anchor="middle" dominant-baseline="central"
                font-size="9" fill="#cbd5e1" font-family="Arial">E</text>
          <text x="10" y="41" text-anchor="middle" dominant-baseline="central"
                font-size="9" fill="#cbd5e1" font-family="Arial">W</text>
        </g>
        <circle cx="40" cy="40" r="2.6" fill="#f1f5f9"/>
      </svg>
    </div>
    <div id="toast"></div>
  </main>
</div>

<div id="modal">
  <div class="m-box">
    <div class="m-head">
      <span class="mt" id="m-title"></span>
      <a id="m-open" href="#" target="_blank">새 창에서 열기 ↗</a>
      <button id="m-close">닫기 ✕</button>
    </div>
    <iframe id="m-frame" src="about:blank" title="MeetMap 도면 뷰"></iframe>
  </div>
</div>

<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
